name: CI devops 2026

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:

  # ==========================================
  # 1. TESTS BACKEND ET SONARCLOUD
  # ==========================================

  test-backend:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'simple-api/pom.xml'

      - name: Build and test with Maven
        run: mvn -B clean verify --file ./simple-api/pom.xml

      - name: SonarQube Cloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=MaloD25_tp-devops-correction-docker
          -Dsonar.organization=malod25
          -Dsonar.host.url=https://sonarcloud.io
          --file ./simple-api/pom.xml

  # ==========================================
  # 2. CONSTRUCTION ET PUBLICATION DOCKERHUB
  # ==========================================

  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: maloduf/tp-devops-simple-api:latest

      - name: Build image database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: maloduf/tp-devops-database:latest

      - name: Build image httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: maloduf/tp-devops-httpd:latest

      - name: Build image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: maloduf/tp-devops-frontend:latest

  # ==========================================
  # 3. DEPLOIEMENT AUTOMATIQUE AVEC ANSIBLE
  # ==========================================

  deploy:
    name: Deploy to Takima
    needs: build-and-push-docker-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible and Docker collection
        run: |
          python -m pip install "ansible-core==2.18.*"
          ansible-galaxy collection install community.docker:==4.8.1
          ansible --version

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -t ed25519 malo.dufournier.takima.school > ~/.ssh/known_hosts

          ssh-keygen -lf ~/.ssh/known_hosts | grep -F \
            'SHA256:aprfpwxjAcmGqvrLKQkrHnqMzNIRoI77Y5Fu6vEaVBQ'

          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application with Ansible
        working-directory: ./ansible
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ANSIBLE_HOST_KEY_CHECKING: "True"
        run: |
          ansible-playbook \
            -i inventories/setup.yml \
            --private-key ~/.ssh/id_ed25519 \
            playbook.yml
