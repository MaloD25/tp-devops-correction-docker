
name: CI devops 2026

# Déclenche le workflow à chaque push sur main ou develop
# et lors d'une pull request
on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04

    steps:
      # Récupère le code du dépôt GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # Installe Java 21 et Maven
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'simple-api/pom.xml'

      # Compile le backend et exécute les tests
      - name: Build and test with Maven
        run: mvn -B clean verify --file ./simple-api/pom.xml

      
      
      
      # Analyse la qualité du code avec SonarQube Cloud
      - name: SonarQube Cloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=MaloD25_tp-devops-correction-docker
          -Dsonar.organization=malod25
          -Dsonar.host.url=https://sonarcloud.io
          --file ./simple-api/pom.xml




  # Construit les images Docker après la réussite des tests
  
  build-and-push-docker-image:
    needs: test-backend
    runs-on: ubuntu-24.04

    steps:
      # Récupère le code du dépôt
      - name: Checkout code
        uses: actions/checkout@v4

      # Authentification à Docker Hub AVANT la publication
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Construction et publication du backend
      - name: Build image backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-simple-api:latest

      # Construction et publication de la base de données
      - name: Build image database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-database:latest

      # Construction et publication du serveur HTTP
      - name: Build image httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/tp-devops-httpd:latest

